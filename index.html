<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Library · Helloworld Studio</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/library/library.css" />
  </head>
  <body>
    <header class="st-topbar">
      <div class="st-topbar-left">
        <strong class="st-brand">Helloworld Studio</strong>
        <span class="st-topbar-sep"></span>
        <span class="st-topbar-section">Library</span>
      </div>
      <div class="st-topbar-right">
        <button id="btn-logout" class="st-btn" type="button" title="Sign out — clear stored password">Sign out</button>
        <a class="st-link st-link-primary" href="/filmmaker.html">Open Filmmaker</a>
      </div>
    </header>

    <main class="lib-main">
      <div class="lib-tabs">
        <button class="lib-tab lib-tab-active" data-cat="maps">Maps</button>
        <button class="lib-tab" data-cat="characters">Characters</button>
        <button class="lib-tab" data-cat="bgm">Audio</button>
      </div>

      <div class="lib-upload-zone" id="upload-zone">
        <input id="file-input" type="file" multiple class="hidden" />
        <button id="btn-pick" class="st-btn st-btn-primary" type="button">Choose files</button>
        <span class="lib-upload-hint">or drop files here</span>
      </div>

      <div class="lib-progress" id="upload-progress"></div>

      <div class="lib-content" id="lib-content">
        <ul class="lib-list" id="file-list">
          <li class="lib-empty">Loading…</li>
        </ul>
        <!-- Characters 탭일 때만 활성. 캐릭터 선택 시 미리보기 + 액션 -->
        <aside class="lib-detail hidden" id="char-detail">
          <canvas id="detail-preview" class="lib-detail-preview" width="256" height="256"></canvas>
          <div class="lib-detail-info">
            <h3 id="detail-name">No character selected</h3>
            <p id="detail-sub" class="lib-detail-sub"></p>
            <div class="lib-detail-actions-title">Animations</div>
            <div id="detail-actions" class="lib-detail-actions"></div>
          </div>
        </aside>
      </div>
    </main>

    <div id="auth-modal" class="auth-modal hidden">
      <div class="auth-box">
        <h2>Authentication</h2>
        <p>Enter the password configured as the <code>STUDIO_PASSWORD</code> environment variable.</p>
        <input id="auth-input" type="password" placeholder="Password" autocomplete="current-password" />
        <div class="auth-actions">
          <button id="auth-submit" class="st-btn st-btn-primary" type="button">Sign in</button>
        </div>
        <p id="auth-error" class="auth-error hidden"></p>
      </div>
    </div>

    <!-- 캐릭터 업로드 확인 모달 — 미리보기 + 이름 입력 후 업로드 -->
    <div id="char-upload-modal" class="auth-modal hidden">
      <div class="auth-box cu-box">
        <h2>Upload character</h2>
        <p id="cu-filename" class="cu-filename"></p>
        <div class="cu-preview-row">
          <canvas id="cu-preview" width="192" height="192" class="cu-preview"></canvas>
          <div class="cu-info">
            <label class="cu-name-label">Name
              <input id="cu-name" type="text" placeholder="character" autocomplete="off" />
            </label>
            <label class="cu-name-label">Body type
              <select id="cu-body">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="none">None / Other</option>
              </select>
            </label>
            <div class="cu-actions-label">Detected actions</div>
            <div id="cu-actions" class="lib-tags"></div>
            <p id="cu-warn" class="auth-error hidden"></p>
          </div>
        </div>
        <div class="auth-actions">
          <button id="cu-cancel" class="st-btn" type="button">Cancel</button>
          <button id="cu-submit" class="st-btn st-btn-primary" type="button">Upload</button>
        </div>
      </div>
    </div>

    <div id="toast" class="st-toast hidden"></div>
    <script type="module" src="/src/library/main.ts"></script>
  </body>
</html>
